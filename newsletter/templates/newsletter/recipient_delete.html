{% extends 'newsletter/base.html' %}

{% block title %}Delete recipient{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Delete recipient</h1>
</div>
{% endblock %}

{% block content %}
<p>Are you sure you want to delete the recipient "{{ recipient.full_name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'newsletter:recipient_detail' recipient.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
