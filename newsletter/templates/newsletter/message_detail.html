{% extends 'newsletter/base.html' %}

{% block title %}Просмотр сообщения{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Просмотр сообщения</h1>
</div>
{% endblock %}
{% block content %}
<p>Тема: {{ message.subject }}</p>
<p>Содержимое: {{ message.body }}</p>
<a href="{% url 'newsletter:message_edit' message.pk %}" class="btn btn-secondary">Редактировать</a>
<a href="{% url 'newsletter:message_delete' message.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'newsletter:messages_list' %}" class="btn btn-primary">Вернуться к списку</a>
{% endblock %}
