{% extends 'newsletter/base.html' %}

{% block title %}Message detail{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Message detail</h1>
</div>
{% endblock %}
{% block content %}
<p>Subject: {{ message.subject }}</p>
<p>Content: {{ message.body }}</p>
<a href="{% url 'newsletter:message_edit' message.pk %}" class="btn btn-secondary">Edit</a>
<a href="{% url 'newsletter:message_delete' message.pk %}" class="btn btn-danger">Delete</a>
<a href="{% url 'newsletter:messages_list' %}" class="btn btn-primary">Back to message list</a>
{% endblock %}
