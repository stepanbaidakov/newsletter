{% extends 'newsletter/base.html' %}

{% block title %}Delete message{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Delete message</h1>
</div>
{% endblock %}

{% block content %}
<p>Are sure you want ot delete the message "{{ message.subject }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'newsletter:message_detail' message.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
