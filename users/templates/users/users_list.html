{% extends 'newsletter/base.html' %}
{% block title %}Пользователи{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Пользователи</h1>
</div>
{% endblock %}
{% block content %}
<div class="row text-center">

    {% for user in users %}
    <div class="col-3">
        <ul class="list-group">
            <li class="list-group-item">Тема: {{user.email}}</li>
            <li class="list-group-item">Содержимое: {{user.fullname}}</li>
            <a href="{% url 'users:profile' user.pk %}"
               class="btn btn-primary">
                Подробнее
            </a>
            <form action="{% url 'users:block' user.pk %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-secondary mt-1">Зоблокировать</button>
            </form>
        </ul>
    </div>
    {% endfor %}
</div>
{% endblock %}
