{% extends 'newsletter/base.html' %}
{% block title %}Создание пароля{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Создание пароля</h1>
</div>
{% endblock %}

{% block content %}
<h2>Создайте пароль</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-secondary">Отправить</button>
    <a href="{% url 'users:login' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
