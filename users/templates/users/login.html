{% extends 'newsletter/base.html' %}
{% block title %}Login form{% endblock %}
{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Login form</h1>
</div>
{% endblock %}

{% block content %}

<div class="row text-start">
<div class="col-lg col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Login</button>
                    </form>
                    <a href="{% url 'users:password_reset' %}" class="btn btn-secondary">Forgot password</a>
                </div>
            </div>
        </div>
</div>
{% endblock %}
